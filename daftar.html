<body>
  <form>
    <h2>Pendaftaran investasi bodong</h2>
    <label>Nama lengkap</label>
    <input type="text" placeholder="Masukkan nama lengkap anda" required>
    <br><br>
    <label>Email</label>
    <input type="email" placeholder="Masukkan Email anda" required>
    <br><br>
    <label>Password</label>
    <input type="password" placeholder="Masukkan Password anda" required>
    <br><br>
    <label>No. WA/HP</label>
    <input type="number" placeholder="Masukkan Nomor WA/HP anda" required>
    <br> <br>
    <label>Tanggal lahir</label>
    <input type="date" required>
    <br>
    <button type="submit">Kirim</button>
  </form>

</body>
